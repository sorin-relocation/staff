<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SŌRIN スタッフ案件確認</title>
<style>
:root{--navy:#102f40;--teal:#167d78;--gold:#d4af37;--ink:#20313a;--muted:#71818a;--line:#e4eaed;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:20px 14px}.head{background:var(--navy);color:white;padding:20px;border-radius:16px}.head strong{display:block;font-size:18px}.head small{color:#c8d8dd}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.field{display:grid;gap:7px;margin:12px 0}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;background:var(--teal);color:white;padding:12px 16px;font-weight:700;font:inherit;cursor:pointer}.status{font-size:14px;line-height:1.7}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.item strong{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.alert{padding:12px;background:#fff8e8;border:1px solid #f0dfad;border-radius:10px;font-size:13px;line-height:1.6}
</style>
</head>
<body><main class="wrap"><header class="head"><strong>SŌRIN スタッフ案件確認</strong><small>通知された案件の確認ページ</small></header>
<section class="card"><p id="status" class="status" role="status">リンクを確認しています…</p><div id="details" hidden></div></section>
<p class="muted">このページには、通知リンクで指定された案件の必要な情報だけが表示されます。</p></main>
<script>
// 公開可能なSupabase URLとpublishable/anon keyのみ設定。Service Role KeyやLINEアクセストークンは置かない。
const SUPABASE_URL='SET_SUPABASE_URL';
const SUPABASE_PUBLISHABLE_KEY='SET_SUPABASE_PUBLISHABLE_KEY';
const FUNCTION_NAME='staff-case-view';
const statusEl=document.getElementById('status');
const detailsEl=document.getElementById('details');
function addItem(label,value){if(value===null||value===undefined||String(value).trim()==='')return;const row=document.createElement('div');row.className='item';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=String(value);row.append(small,strong);detailsEl.append(row)}
async function main(){
 const token=new URL(location.href).searchParams.get('token');
 if(!token){statusEl.textContent='このリンクには閲覧用の情報がありません。通知メッセージ内のリンクから開いてください。';return}
 if(SUPABASE_URL.startsWith('SET_')||SUPABASE_PUBLISHABLE_KEY.startsWith('SET_')){statusEl.textContent='スタッフページの接続設定がまだ完了していません。管理者に連絡してください。';return}
 try{
  const response=await fetch(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':`Bearer ${SUPABASE_PUBLISHABLE_KEY}`},body:JSON.stringify({token})});
  const result=await response.json();
  if(!response.ok||!result||!result.case){throw new Error(result?.error||'このリンクは無効か、閲覧期限が切れています。')}
  const c=result.case;statusEl.textContent='案件情報';
  addItem('案件番号',c.case_no);addItem('作業日時',c.work_datetime);addItem('作業内容',c.work_summary);addItem('住所',c.address);addItem('立寄所',c.stops);addItem('作業上の注意',c.notes);
  detailsEl.hidden=false;
 }catch(e){statusEl.textContent=e.message||'案件情報を取得できませんでした。管理者に連絡してください。'}
}
main();
</script></body></html>
